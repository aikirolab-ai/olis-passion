<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Oli's Passion — Appeler Amia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--gold:#C5A059;--copper:#B87333;--amber:#ffb877;--bg:#0a0908;--txt:#F9F5F0;--red:#e05646}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Hanken Grotesk',system-ui,sans-serif;
    background:radial-gradient(ellipse 70% 50% at 50% -8%,#1c140c 0%,var(--bg) 55%);
    color:var(--txt);min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 22px;text-align:center}

  .label{font-size:11px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;opacity:.85}
  h1{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(40px,9vw,66px);
    background:linear-gradient(120deg,var(--copper),var(--gold) 45%,#f0e4c8 82%,#fff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.05;margin-bottom:14px}
  .tag{color:rgba(249,245,240,.5);font-size:15px;max-width:400px;line-height:1.65;margin-bottom:58px}

  /* ---- bouton épuré ---- */
  .stage{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center}
  /* halo lumineux qui tourne autour */
  .stage::before{content:"";position:absolute;width:196px;height:196px;border-radius:50%;
    background:conic-gradient(from 0deg,var(--amber),transparent 26%,var(--copper) 50%,transparent 74%,var(--gold));
    filter:blur(20px);opacity:.8;animation:spin 5.5s linear infinite;z-index:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ring1{position:absolute;width:172px;height:172px;border-radius:50%;border:1px solid rgba(197,160,89,.28);opacity:0;z-index:1}
  .stage.active .ring1{opacity:1;animation:pulse 2.6s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.96);opacity:.5}100%{transform:scale(1.4);opacity:0}}

  .callbtn{position:relative;z-index:2;width:168px;height:168px;border-radius:50%;border:none;cursor:pointer;color:var(--txt);font-family:inherit;
    background:radial-gradient(circle at 50% 32%,#241b12,#0f0b07 72%);
    box-shadow:inset 0 1px 1px rgba(255,220,170,.18),inset 0 -14px 34px rgba(0,0,0,.55),0 16px 40px rgba(0,0,0,.5);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
    transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease}
  .callbtn::before{content:"";position:absolute;inset:0;border-radius:50%;padding:1.5px;
    background:linear-gradient(145deg,var(--amber),var(--copper) 55%,rgba(197,160,89,.18));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
  .callbtn:hover{transform:translateY(-2px);box-shadow:inset 0 1px 1px rgba(255,220,170,.18),inset 0 -14px 34px rgba(0,0,0,.55),0 18px 44px rgba(0,0,0,.5),0 0 44px rgba(197,160,89,.28)}
  .callbtn:active{transform:scale(.98)}
  .callbtn .ico{font-size:40px;line-height:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
  .callbtn .txt{font-weight:700;font-size:15.5px;letter-spacing:.01em;background:linear-gradient(120deg,#fff,var(--amber));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

  .callbtn.active{background:radial-gradient(circle at 50% 32%,#341611,#160a07 72%)}
  .callbtn.active::before{background:linear-gradient(145deg,#ff8a72,var(--red) 60%,rgba(224,86,70,.2))}
  .callbtn.connecting{opacity:.8}

  /* équaliseur (en appel) */
  .wave{display:none;align-items:flex-end;gap:5px;height:30px}
  .callbtn.active .wave{display:flex}
  .callbtn.active .ico{display:none}
  .wave i{width:5px;height:6px;border-radius:3px;background:linear-gradient(180deg,var(--amber),var(--copper));transform-origin:bottom;transform:scaleY(calc(.3 + var(--amp,.2)*var(--m)))}
  .wave i:nth-child(1){--m:.7}.wave i:nth-child(2){--m:1.3}.wave i:nth-child(3){--m:1.8}.wave i:nth-child(4){--m:1.3}.wave i:nth-child(5){--m:.7}

  .status{margin-top:36px;min-height:24px;font-size:15px;font-weight:500;color:rgba(249,245,240,.72);display:flex;align-items:center;gap:9px;justify-content:center}
  .dot{width:8px;height:8px;border-radius:50%;background:#484440;flex:none;transition:background .3s}
  .dot.live{background:#5F9E7A}.dot.speaking{background:var(--gold)}
  .err{color:var(--red);font-size:13px;margin-top:12px;min-height:16px}

  .transcript{margin-top:24px;width:100%;max-width:450px;max-height:28vh;overflow:auto;text-align:left;display:none;flex-direction:column;gap:9px}
  .bubble{padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5}
  .bubble.sophie{background:rgba(197,160,89,.1);border:1px solid rgba(197,160,89,.18);color:#f2e7d2;border-bottom-left-radius:4px;align-self:flex-start;max-width:88%}
  .bubble.client{background:rgba(255,255,255,.05);color:rgba(249,245,240,.82);border-bottom-right-radius:4px;align-self:flex-end;max-width:88%}

  .foot{margin-top:52px;font-size:12px;color:rgba(249,245,240,.32);line-height:1.6}
  .foot b{color:rgba(249,245,240,.48)}
</style>
</head>
<body>
  <div class="label">Réservez par la voix</div>
  <h1>Oli's Passion</h1>
  <p class="tag">Appelez Amia, notre réceptionniste. Elle prend votre réservation et répond à vos questions, à toute heure.</p>

  <div class="stage" id="stage">
    <span class="ring1"></span>
    <button id="call" class="callbtn">
      <span class="ico" id="ico">📞</span>
      <span class="wave"><i></i><i></i><i></i><i></i><i></i></span>
      <span class="txt" id="btntxt">Parler à Amia</span>
    </button>
  </div>

  <div class="status"><span class="dot" id="dot"></span><span id="status">Prêt à appeler</span></div>
  <div class="err" id="err"></div>
  <div class="transcript" id="transcript"></div>

  <div class="foot">Assistant vocal IA — démo <b>MiamOS</b> par Aikiro Lab</div>

<script type="module">
  import Vapi from "https://esm.sh/@vapi-ai/web@2.3.8";
  const PUBLIC_KEY="461458a7-1861-442c-8ca9-4f45de781f81";
  const ASSISTANT_ID="045a099c-090d-4144-b85c-cf64797190b5";

  const vapi=new Vapi(PUBLIC_KEY);
  const stage=document.getElementById("stage"),btn=document.getElementById("call"),btntxt=document.getElementById("btntxt"),
        ico=document.getElementById("ico"),statusEl=document.getElementById("status"),dot=document.getElementById("dot"),
        err=document.getElementById("err"),tr=document.getElementById("transcript");
  let state="idle";

  function setState(s){
    state=s;
    stage.classList.toggle("active",s==="active");
    btn.classList.toggle("active",s==="active");
    btn.classList.toggle("connecting",s==="connecting");
    if(s==="idle"){ico.textContent="📞";btntxt.textContent="Parler à Amia";statusEl.textContent="Prêt à appeler";dot.className="dot";document.documentElement.style.setProperty("--amp",".2");}
    if(s==="connecting"){ico.textContent="…";btntxt.textContent="Connexion";statusEl.textContent="Connexion à Amia…";dot.className="dot";}
    if(s==="active"){btntxt.textContent="Raccrocher";statusEl.textContent="En ligne — Amia vous écoute";dot.className="dot live";}
  }

  btn.addEventListener("click",async()=>{
    err.textContent="";
    if(state==="idle"){
      setState("connecting");
      try{ await vapi.start(ASSISTANT_ID); }
      catch(e){ setState("idle"); err.textContent="Micro ou connexion indisponible. Ouvrez la page en https (pas en fichier local)."; console.error(e); }
    } else { vapi.stop(); }
  });

  vapi.on("call-start",()=>setState("active"));
  vapi.on("call-end",()=>setState("idle"));
  vapi.on("speech-start",()=>{if(state==="active"){statusEl.textContent="Amia parle…";dot.className="dot speaking";}});
  vapi.on("speech-end",()=>{if(state==="active"){statusEl.textContent="Amia vous écoute";dot.className="dot live";}});
  vapi.on("volume-level",(v)=>{document.documentElement.style.setProperty("--amp",Math.min(1.6,0.2+v*2.4).toFixed(2));});
  vapi.on("error",(e)=>{console.error(e);err.textContent="Souci de connexion. Réessayez.";setState("idle");});
  vapi.on("message",(m)=>{
    if(m.type==="transcript"&&m.transcriptType==="final"){
      tr.style.display="flex";
      const b=document.createElement("div");
      b.className="bubble "+(m.role==="assistant"?"sophie":"client");
      b.textContent=m.transcript; tr.appendChild(b); tr.scrollTop=tr.scrollHeight;
    }
  });
</script>
</body>
</html>
